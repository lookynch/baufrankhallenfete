name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrationen, Secrets, Deploy, Smoke-Test
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'baufrankhallenfete' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Konfiguration prüfen
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt"; exit 1; }
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::error::database_id in wrangler.toml ist noch der Platzhalter – scripts/bootstrap-cloudflare.sh ausführen"; exit 1
          fi

      - run: npm run build

      - name: D1-Migrationen anwenden
        run: npx wrangler d1 migrations apply fete --remote

      - name: Runtime-Secrets synchronisieren
        env:
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          QR_SECRET: ${{ secrets.QR_SECRET }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
          BUZZER_HMAC_SECRET: ${{ secrets.BUZZER_HMAC_SECRET }}
          ENC_KEY: ${{ secrets.ENC_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PBKDF2_ITERATIONS: ${{ vars.PBKDF2_ITERATIONS }}
        run: |
          for required in SESSION_PEPPER COOKIE_SECRET QR_SECRET IP_HASH_SECRET BUZZER_HMAC_SECRET ENC_KEY; do
            test -n "${!required}" || { echo "::error::Secret $required fehlt"; exit 1; }
          done
          file="$(mktemp)"
          trap 'rm -f "$file"' EXIT
          jq -n 'env | with_entries(select(.key | IN("SESSION_PEPPER","COOKIE_SECRET","QR_SECRET","IP_HASH_SECRET","BUZZER_HMAC_SECRET","ENC_KEY","SPOTIFY_CLIENT_ID","SPOTIFY_CLIENT_SECRET","BOOTSTRAP_TOKEN","ACCESS_TEAM_DOMAIN","ACCESS_AUD","CF_ANALYTICS_TOKEN","CF_ACCOUNT_ID","PBKDF2_ITERATIONS")) | select(.value != ""))' > "$file"
          npx wrangler pages secret bulk "$file" --project-name "$PAGES_PROJECT"
          present="$(npx wrangler pages secret list --project-name "$PAGES_PROJECT")"
          for optional in SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET BOOTSTRAP_TOKEN ACCESS_TEAM_DOMAIN ACCESS_AUD CF_ANALYTICS_TOKEN PBKDF2_ITERATIONS; do
            if [ -z "${!optional}" ] && grep -qE "^[[:space:]]*- $optional:" <<<"$present"; then
              echo "Entferne $optional aus Pages (in GitHub nicht gesetzt)"
              npx wrangler pages secret delete "$optional" --project-name "$PAGES_PROJECT"
            fi
          done

      - name: Deploy nach Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Smoke-Test Produktion
        run: |
          url="${PRODUCTION_URL:-https://$PAGES_PROJECT.pages.dev}"
          for attempt in $(seq 1 20); do
            body="$(curl -fsS "$url/api/health" || true)"
            if echo "$body" | jq -e '.ok == true and .schemaVersion != null' > /dev/null 2>&1; then
              echo "Produktion gesund: $body"; exit 0
            fi
            sleep 6
          done
          echo "::error::Health-Check fehlgeschlagen – im Cloudflare-Dashboard auf die vorherige Version zurückrollen"
          exit 1
