[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fete-agent"
version = "1.0.0"
description = "PC-Agent: 433-MHz-Buzzer an der Bar bucht Getränkekästen in der Fete-App"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fete-agent = "fete_agent.app:main"

[tool.setuptools]
packages = ["fete_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_level = "INFO"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
