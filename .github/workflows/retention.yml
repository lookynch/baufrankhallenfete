name: Datenlöschung

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: retention
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  purge:
    name: Löschfristen auf Produktions-D1 anwenden
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Löschlauf und Nachweis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt"; exit 1; }
          sql="$(node scripts/retention-sql.ts)"
          started="$(date +%s000)"
          npx wrangler d1 execute fete --remote --yes --command "$sql"
          npx wrangler d1 execute fete --remote --json --command "SELECT updated_at FROM kv WHERE key = 'retention_run'" \
            | jq -e --argjson since "$started" '.[0].results[0].updated_at >= $since - 60000'

      - name: Fehler melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue create --title "Datenlöschung fehlgeschlagen ($(date -u +%F))" --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
